name: Log lines

# Hourly through the NBA day. Each game is logged once, when it is within
# 3 hours of tip-off (after most injury news), and its closing lines are
# captured once within the hour before tip. The events list is free; each
# game costs one Odds API credit to log and one for the closing snapshot.
on:
  schedule:
    - cron: "15 15-23 * * *"   # 15:15-23:15 UTC (weekend matinees through early evening tips)
    - cron: "15 0-3 * * *"     # 00:15-03:15 UTC (late tips)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experiment-data
  cancel-in-progress: false

jobs:
  lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Log lines and paper bets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python autobet.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add experiment
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Lines: $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase
            git push
          fi
